<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Kwingineko</title>
  <desc id="desc">A retro terminal themed banner with the Kwingineko monogram and title.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#45463e" stroke-opacity=".2" stroke-width="1"/>
    </pattern>
    <pattern id="scanlines" width="1" height="6" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#000" opacity=".16"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="12" fill="#1e1f1c"/>
  <rect x="10" y="10" width="1180" height="280" rx="8" fill="url(#grid)" stroke="#45463e" stroke-width="2"/>
  <rect x="10" y="10" width="1180" height="280" rx="8" fill="url(#scanlines)"/>

  <!-- Pixel stars -->
  <g fill="#e6db74">
    <path d="M1060 62h8v8h-8zM1112 116h5v5h-5zM1027 228h6v6h-6zM920 74h4v4h-4z"/>
  </g>
  <g fill="#a6e22e">
    <path d="M1143 207h7v7h-7zM986 183h5v5h-5zM1090 82h4v4h-4z"/>
  </g>
  <g fill="#f92672">
    <path d="M1032 119h5v5h-5zM1140 64h4v4h-4z"/>
  </g>

  <!-- Window chrome -->
  <path d="M44 78h1112v2H44z" fill="#45463e"/>
  <g fill="#f92672"><rect x="1090" y="48" width="12" height="12"/><rect x="1112" y="48" width="12" height="12"/></g>
  <rect x="1134" y="48" width="12" height="12" fill="#a6e22e"/>
  <text x="48" y="62" fill="#a6e22e" font-family="monospace" font-size="16" letter-spacing="2">PERSONAL WORKSTATION</text>

  <!-- Site favicon mark, enlarged -->
  <g transform="translate(100 113) scale(2.3)">
    <rect width="32" height="32" rx="4" fill="#1e1f1c"/>
    <rect x="1" y="1" width="30" height="30" rx="3" fill="none" stroke="#45463e" stroke-width="1.5"/>
    <path fill="#a6e22e" d="M 7 9 L 10 9 L 13.8 22 L 11.4 22 L 10.4 18.5 L 6.6 18.5 L 5.6 22 L 3.2 22 Z M 7.3 16 L 9.7 16 L 8.5 11.8 Z"/>
    <path fill="#a6e22e" d="M 15 9 L 17.4 9 L 21.2 16.8 L 21.2 9 L 23.4 9 L 23.4 22 L 21 22 L 17.2 14.2 L 17.2 22 L 15 22 Z"/>
    <rect x="24.5" y="19" width="4.5" height="3" fill="#f92672"/>
  </g>

  <text x="220" y="183" fill="#f8f8f2" font-family="monospace, 'Courier New'" font-size="76" font-weight="700" letter-spacing="-3">kwingineko</text>
  <rect x="222" y="207" width="12" height="24" fill="#f92672"/>
  <text x="250" y="226" fill="#a6e22e" font-family="monospace, 'Courier New'" font-size="18" letter-spacing="3">A PERSONAL PORTFOLIO / EST. IN PIXELS</text>

  <path d="M44 254h1112" stroke="#45463e" stroke-width="2"/>
  <text x="48" y="276" fill="#75715e" font-family="monospace" font-size="12" letter-spacing="1">[ EXPERIENCE ]  [ PROJECTS ]  [ WRITING ]  [ CONTACT ]</text>
</svg>
